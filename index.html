<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>DTZ B1 Trainer</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>DTZ B1 Trainer</h1>
    <button id="themeToggle" class="icon-btn" aria-label="Tema değiştir" title="Karanlık/Aydınlık mod">&#9789;</button>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="app-footer">
    <p>v1.0 &middot; Offline çalışır &middot; Cevaplar cihazınızda saklanır</p>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/components/soru-kart.js"></script>
  <script src="js/components/redemittel-bank.js"></script>
  <script src="js/study-modes/tema-modu.js"></script>
  <script src="js/study-modes/zayif-konular-modu.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
