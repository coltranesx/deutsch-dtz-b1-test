<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>DTZ B1 Trainer</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1><button type="button" id="navHome" class="app-header-home-btn" aria-label="Ana sayfaya dön" title="Ana sayfaya dön">DTZ B1 Trainer</button></h1>
    <div class="header-actions">
      <button id="navZayifKonular" class="icon-btn" type="button" aria-label="Zayıf Konular Modu" title="Zayıf Konular Modu">🎯</button>
      <button id="navGunluk15" class="icon-btn" type="button" aria-label="Günlük 15 Dakika" title="Günlük 15 Dakika">🔥</button>
      <button id="navKamp" class="icon-btn" type="button" aria-label="21 Günlük Kamp" title="21 Günlük Kamp">📅</button>
      <button id="navDtzSinav" class="icon-btn" type="button" aria-label="DTZ Sınav Modu" title="DTZ Sınav Modu">📝</button>
      <div class="header-actions-divider"></div>
      <div class="header-dropdown">
        <button id="navAraclarToggle" class="icon-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="navAraclarMenu" aria-label="Araçlar &amp; Raporlar" title="Araçlar &amp; Raporlar">🧰</button>
        <div id="navAraclarMenu" class="header-dropdown-menu" role="menu" hidden>
          <button type="button" class="header-dropdown-item" role="menuitem" data-action="istatistik">📊 <span>İstatistikler</span></button>
          <button type="button" class="header-dropdown-item" role="menuitem" data-action="disaAktarma">📤 <span>Dışa Aktar</span></button>
          <button type="button" class="header-dropdown-item" role="menuitem" data-action="redemittel">💬 <span>Redemittel-Bank</span></button>
        </div>
      </div>
      <button id="langToggle" class="icon-btn" aria-label="Dil değiştir" title="Türkçe/İngilizce">EN</button>
      <button id="themeToggle" class="icon-btn" aria-label="Tema değiştir" title="Karanlık/Aydınlık mod">&#9789;</button>
    </div>
    <div id="navToast" class="header-toast" role="status" aria-live="polite" hidden></div>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="app-footer">
    <p id="footerText">v1.0 &middot; Offline çalışır &middot; Cevaplar cihazınızda saklanır</p>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/study-modes/karistirma-yardimci.js"></script>
  <script src="js/components/soru-kart.js"></script>
  <script src="js/components/redemittel-bank.js"></script>
  <script src="js/study-modes/soru-havuzu-yardimci.js"></script>
  <script src="js/study-modes/istatistik-yardimci.js"></script>
  <script src="js/study-modes/disa-aktarma-yardimci.js"></script>
  <script src="js/study-modes/sinav-sayaci-yardimci.js"></script>
  <script src="js/study-modes/tema-modu.js"></script>
  <script src="js/study-modes/zayif-konular-modu.js"></script>
  <script src="js/study-modes/kamp-21-gun.js"></script>
  <script src="js/study-modes/gunluk-15-dakika.js"></script>
  <script src="js/study-modes/dtz-sinav-modu.js"></script>
  <script src="js/components/istatistik-ekrani.js"></script>
  <script src="js/components/disa-aktarma.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
